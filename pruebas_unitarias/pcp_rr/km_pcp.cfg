# Nivel de detalle maximo a mostrar en logs. Compatible con log_level_from_string().
LOG_LEVEL=INFO

# Tamano maximo permitido para cualquier segmento en memoria.
SEGMENT_MAX_SIZE=256

# Algoritmo para seleccionar huecos libres. Valores posibles: BEST o WORST.
ALLOCATION_STRATEGY=BEST

# Tiempo en milisegundos de espera antes de responder una peticion de instruccion.
INSTRUCTION_DELAY=50

# Tiempo en milisegundos para dar por finalizada la compactacion.
COMPACTION_DELAY=100

# Path base donde se encuentran los archivos de pseudocodigo.
SCRIPTS_BASEPATH=../pruebas_unitarias/pcp_rr

LISTEN_IP=0.0.0.0
LISTEN_PORT=8002

